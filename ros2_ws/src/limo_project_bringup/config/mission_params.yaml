# Single source of truth for the whole stack.
#
# Everything you will actually want to change on exam day is in this file, so
# you never have to edit Python under pressure. After changing it:
#   colcon build --packages-select limo_project_bringup --symlink-install
# (or just relaunch, since --symlink-install makes the yaml live)
#
# WAYPOINTS: flat triples [x, y, yaw_degrees, ...] in the *map* frame.
# Fill these in after you save the classroom map on day 1 -- read the
# coordinates straight off RViz with the "Publish Point" tool, or use
#   ros2 topic echo /clicked_point
# while clicking in RViz.

/**:
  ros__parameters:
    use_sim_time: false

color_camera:
  ros__parameters:
    device: ""                       # "" = auto-resolve /dev/v4l/by-id/*Dabai*index0
    width: 640
    height: 480
    fps: 30.0
    fourcc: "MJPG"
    frame_id: "camera_link"
    hfov_deg: 71.0                   # Orbbec Dabai colour FOV
    image_topic: "/camera/color/image_raw"
    info_topic: "/camera/color/camera_info"

mock_detector:
  ros__parameters:
    mode: "tf"                       # "tf" (geometric, useful) | "random" (smoke test)
    rate_hz: 15.0
    map_frame: "map"
    camera_frame: "camera_link"
    camera_convention: "body"
    image_width: 640
    image_height: 480
    hfov_deg: 71.0                   # Orbbec Dabai colour FOV
    # Imaginary people, flat [x1, y1, x2, y2, ...] in the map frame.
    # Put these where you will actually stand during a dry run so the
    # numbers the tracker recovers can be checked against a tape measure.
    people_xy: [2.0, 0.0, 3.5, 1.2, 1.0, -1.5]
    max_range_m: 6.0
    min_range_m: 0.35
    noise_px: 4.0
    dropout_prob: 0.08
    score_mean: 0.82
    fake_inference_ms: 6.0
    detections_topic: "/perception/detections"

yolo_detector:
  ros__parameters:
    backend: "tensorrt"
    fallback_backends: ["onnxruntime", "ultralytics"]
    # Stock COCO yolov8n, FP16, 416. Measured on this robot 2026-08-26 with
    # clocks pinned: 5.02 ms inference (199 FPS), 13.75 ms end-to-end (73 FPS),
    # p95 5.05 ms. Comfortably past the 50 FPS rubric line with no latency
    # tail. The fallback chain walks down to formats that need no engine at
    # all, so a corrupt or version-mismatched .engine degrades instead of
    # taking the detector down.
    model_path: "/home/agilex/limo_project/models/exported/yolov8n_416_fp16.engine"
    fallback_model_paths:
      - "/home/agilex/limo_project/models/exported/yolov8n_416_fp32.engine"
      - "/home/agilex/limo_project/models/exported/yolov8n_416.onnx"
    # Must match the engine: the .engine is built at a fixed 416x416 input and
    # will not accept 640 tensors.
    imgsz: 416
    conf: 0.35
    iou: 0.45
    device: "cuda:0"
    image_topic: "/camera/color/image_raw"
    detections_topic: "/perception/detections"
    image_qos: "best_effort"
    warmup_iterations: 20
    max_rate_hz: 0.0                 # 0 = process every frame that arrives

people_tracker:
  ros__parameters:
    map_frame: "map"
    robot_frame: "base_link"
    camera_frame: "camera_link"
    camera_convention: "body"
    detections_topic: "/perception/detections"
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    use_depth: false
    fallback_hfov_deg: 71.0
    fallback_width: 640
    fallback_height: 480
    min_score: 0.40
    # Association radius: how far apart two observations can be and still be
    # the same person. Too small -> one person counted twice as the robot
    # drives past. Too large -> two people sitting side by side merge into one.
    # 0.9 m is a reasonable classroom starting point; tune it with the mock
    # detector before you ever touch the real model.
    association_radius_m: 0.90
    min_observations_to_confirm: 6
    stale_after_s: 5.0
    position_alpha: 0.35
    max_range_m: 6.0
    min_range_m: 0.30
    # Floor-intersection is only trusted within this range. The camera sits
    # ~18 cm off the floor, so the ray to a distant foot is nearly parallel to
    # the floor and a few pixels of bbox jitter swing the answer by metres.
    # Measured: at 4 m with 5 px noise, ground-plane error is 1.4 m mean /
    # 5.2 m p95, versus 0.30 m / 0.80 m for the shoulder-width estimator.
    # Run limo_perception/test/test_geometry_roundtrip.py to reproduce.
    ground_plane_max_range_m: 2.5
    publish_rate_hz: 5.0
    bottom_edge_margin_px: 6

mission:
  ros__parameters:
    map_frame: "map"
    robot_frame: "base_link"
    waypoints: [1.5, 0.0, 0.0,
                3.0, 1.0, 90.0,
                3.0, -1.0, -90.0,
                0.5, 0.0, 180.0]
    approach_distance_m: 1.10        # how close we stand to "visit" someone
    hold_distance_m: 0.55            # closer than this and we cancel the goal
    hold_release_distance_m: 0.75    # hysteresis, so we do not stutter
    dwell_seconds: 2.5
    goal_timeout_s: 60.0
    max_goal_retries: 2
    loop_patrol: false
    auto_start: false
    tick_hz: 5.0

dashboard:
  ros__parameters:
    port: 8080
    bind: "0.0.0.0"
    image_topic: "/camera/color/image_raw"
    map_frame: "map"
    robot_frame: "base_link"
    jpeg_quality: 70
    stream_max_width: 640
    stream_rate_hz: 12.0

    # Browser WASD teleop. Exists because the AgileX phone app cannot always
    # reach the robot on a school network, and cartographer needs a manually
    # driven seed map before nav2 has anywhere to plan.
    #
    # Deliberately slow: mapping quality is better at low speed, and this is
    # driven from a laptop with network latency in the loop.
    #
    # teleop_timeout_s is the deadman. The browser resends while a key is
    # held; if commands stop arriving -- key released, tab closed, WiFi
    # dropped -- the node publishes one zero Twist and then goes silent,
    # handing /cmd_vel back to nav2. Raising it makes the robot coast longer
    # after contact is lost.
    teleop_enabled: true
    teleop_max_vx: 0.15
    teleop_max_wz: 0.25
    teleop_timeout_s: 0.4
    teleop_rate_hz: 10.0
    waypoints: [1.5, 0.0, 0.0,
                3.0, 1.0, 90.0,
                3.0, -1.0, -90.0,
                0.5, 0.0, 180.0]
